name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate themed snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mohansiva58
          # color_dots: 5 colors, low->high contribution. color_snake: the snake itself.
          outputs: |
            dist/github-snake.svg?color_snake=%23fbbf24&color_dots=%23241414,%235c1414,%237f1d1d,%23dc2626,%23ef4444
            dist/github-snake-light.svg?color_snake=%23b45309&color_dots=%23ffe1e1,%23ffb3b3,%23f87171,%23dc2626,%237f1d1d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
# In README.md, reference the generated files from the `output` branch, e.g.:
#
# <picture>
#   <source media="(prefers-color-scheme: dark)"
#           srcset="https://raw.githubusercontent.com/mohansiva58/mohansiva58/output/github-snake.svg">
#   <source media="(prefers-color-scheme: light)"
#           srcset="https://raw.githubusercontent.com/mohansiva58/mohansiva58/output/github-snake-light.svg">
#   <img alt="contribution snake" src="https://raw.githubusercontent.com/mohansiva58/mohansiva58/output/github-snake.svg">
# </picture>
#
# Note: color_dots/color_snake use URL-encoded "#" (%23) because "#" starts a
# URL fragment otherwise. Colors are comma-separated with no spaces.
# ---------------------------------------------------------------------------
